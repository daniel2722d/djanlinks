# =============================================================================
# DOCKER-COMPOSE.YML — Levanta todo el proyecto con un comando
# =============================================================================
#
# Uso:  docker compose up --build
#
# Servicios:
#   db       → PostgreSQL (base de datos)
#   backend  → API Django en http://localhost:8000
#   frontend → Sitio web (nginx) en http://localhost:8080
#
# Variables de entorno: archivo .env en la raíz
# =============================================================================

services:
  # --- Base de datos PostgreSQL ---
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-djanlinks}
      POSTGRES_USER: ${POSTGRES_USER:-djanlinks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djanlinks}
    volumes:
      - postgres_data:/var/lib/postgresql/data   # Persiste datos entre reinicios
      - ./database:/docker-entrypoint-initdb.d   # Scripts SQL opcionales al iniciar
    ports:
      - "5432:5432"

  # --- API Django ---
  backend:
    build:
      context: .
      dockerfile: docs/Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    working_dir: /app/backend
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  # --- Sitio web estático (carpeta frontend/) ---
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
